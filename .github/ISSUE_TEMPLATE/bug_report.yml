name: Bug Report
description: 报告可以稳定复现的错误或异常行为
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请先搜索已有 Issue，并移除日志、截图中的密钥和个人信息。
  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清楚说明问题及其影响。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 配置……
        3. 点击……
        4. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AIX 短剧工厂版本
      placeholder: 例如 v2.0.0-dev.9
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 11 23H2 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器
      placeholder: 例如 Chrome 版本号；不适用请填写“不适用”
  - type: textarea
    id: environment
    attributes:
      label: Python / Node 等环境
      description: 适用时填写版本、运行模式及 ComfyUI 信息，请勿粘贴凭据。
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 提供必要的脱敏日志，不要粘贴密钥、Token、Cookie、密码或私有地址。
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 可以拖入截图，请先遮挡敏感信息。
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已移除日志和截图中的敏感信息。
          required: true
